# =============================================================================
# Landslide EWS — full dev stack
# -----------------------------------------------------------------------------
# Services: postgres (PostGIS), redis, minio (optional object storage for
# report photos), backend (Django runserver), celery-worker, celery-beat,
# frontend (Vite dev server).
#
# Environment strategy (single source of truth, no duplicated hardcoding):
#   * Django services (backend/worker/beat) read their settings from
#     ../backend/.env via `env_file` — the same file the app reads when run
#     outside Docker (copy backend/.env.example -> backend/.env once).
#     config/settings.py defines the defaults; this file does NOT restate them.
#   * The only vars overridden here are hostname resolutions inside the
#     compose network (postgres/redis/minio instead of localhost) — via
#     ${VAR:-default} so an optional infra/.env can override anything.
#   * frontend reads VITE_API_BASE_URL from the shell/infra/.env, defaulting
#     to the browser-facing host URL (the Vite source bundle is bind-mounted,
#     so its own .env.development is consulted too).
# =============================================================================

name: landslide-ews

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      # Backend/.env already carries POSTGRES_DB/USER/PASSWORD for Django; the
      # postgis image needs the same values to prepare the DB + enable PostGIS.
      POSTGRES_DB: ${POSTGRES_DB:-landslide_ews}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-landslide_ews}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Optional — only needed for report photo/video uploads (S3 bucket).
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    # DB schema is applied on boot so a clean `docker compose up` just works.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      # Compose-network hostnames (local defaults in backend/.env point at
      # localhost, which is wrong inside the stack). Any of these can be
      # overridden via infra/.env to match a production setup.
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/schema/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             celery -A config worker -l info"
    env_file:
      - ../backend/.env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info
    env_file:
      - ../backend/.env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ../frontend-dashboard
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    environment:
      # The browser (host) must reach the published backend port; Vite's dev
      # server logs "VITE ready" on 5173. Sweep default lives in src/api/client.ts.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    volumes:
      - ../frontend-dashboard:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  miniodata:
  frontend_node_modules: